name: CI

# Gerbang wajib sebelum kode boleh mencapai staging/production.
# Kontrak lengkap: specs/002-production-readiness/contracts/ci-pipeline-contract.md
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gerbang 1 — contracts/ci-pipeline-contract.md
      - name: Lint (termasuk aturan jsx-a11y)
        run: npm run lint

      # Gerbang 2 — sinyal type-check terpisah dari build agar gagal lebih cepat
      - name: Type-check
        run: npx tsc -b

      # Gerbang 3
      - name: Unit test
        run: npm test

      # Gerbang 4 — hanya kerentanan kritis/tinggi yang menahan merge (FR-008)
      - name: Audit kerentanan dependency
        run: npm audit --audit-level=high

      # Gerbang 5 — commit SHA disematkan sebagai APP_VERSION (FR-005, T005)
      - name: Build production
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
