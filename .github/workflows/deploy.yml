name: Deploy

# US1 (T006) + US2 (T009): production hanya dari `main`, staging dari branch
# lain — keduanya gated di belakang `ci` (job `ci` pada workflow CI, lihat
# ci.yml) lewat `workflow_run`, bukan berjalan paralel independen.
# Kontrak: specs/002-production-readiness/contracts/ci-pipeline-contract.md
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy to staging
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://lumera-student-batch-1-staging.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.event.workflow_run.head_sha }}

      # --name/--var eksplisit di CLI, BUKAN hanya --env: wrangler.jsonc's
      # env.staging.name/vars terbukti tidak bertahan lewat config redirect
      # yang dibuat @cloudflare/vite-plugin pada langkah Build di atas (lihat
      # catatan di wrangler.jsonc dan worker/security-headers.js) — tanpa
      # --name eksplisit, ini bisa diam-diam deploy ke Worker yang sama
      # dengan production.
      - name: Deploy (wrangler --env staging)
        run: npx wrangler deploy --env staging --name lumera-student-batch-1-staging --var ENVIRONMENT:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Deploy to production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lumera-student-batch-1-production.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FR-005: commit SHA disematkan sebagai VITE_APP_VERSION setiap rilis
      # production, agar versi yang live selalu bisa ditelusuri (T005, T007).
      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.event.workflow_run.head_sha }}

      # --name/--var eksplisit di CLI — lihat catatan di job staging di atas.
      - name: Deploy (wrangler --env production)
        run: npx wrangler deploy --env production --name lumera-student-batch-1-production --var ENVIRONMENT:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
