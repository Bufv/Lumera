name: Browser Inspect

on:
  push:
    branches: [interface]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/lumera-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lumera-preview.log
          exit 1
      - name: Install browser
        run: npx --yes playwright@1.55.0 install chromium
      - name: Capture pathway
        run: |
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size "1440,1200" \
            --wait-for-timeout 4000 \
            "http://127.0.0.1:4173/#/belajar/matematika/bilangan-bulat?mode=demo" \
            pathway.png
      - uses: actions/upload-artifact@v7
        with:
          name: browser-inspect-pathway
          path: pathway.png
          retention-days: 1
